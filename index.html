<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>两人笺 · A Journal for Two</title>
<style>
  :root{
    --paper:#f6f1e7; --card:#fffdf6; --ink:#33302a; --ink-soft:#5c564c;
    --muted:#9a9081; --line:#e3dac8; --vermilion:#b03a2e; --vermilion-soft:#c9502f;
    --pine:#3e5c50; --gold:#a9832f;
    --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",Georgia,"Times New Roman",serif;
    --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    background-image:radial-gradient(#e9e0cd 0.6px, transparent 0.6px);
    background-size:22px 22px;
    color:var(--ink); font-family:var(--serif);
    min-height:100vh;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 20px 90px}
  /* ---------- lock / setup ---------- */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-card{width:100%;max-width:400px;text-align:center;padding:48px 34px 40px;background:var(--card);
    border:1px solid var(--line);border-radius:6px;box-shadow:0 14px 44px rgba(90,75,50,.12)}
  .gate-seal{width:58px;height:58px;margin:0 auto 18px;border-radius:10px;background:var(--vermilion);
    color:#fdf6ec;font-family:var(--serif);font-size:27px;line-height:58px;letter-spacing:2px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
  .gate h1{font-size:29px;letter-spacing:6px;margin:0 0 8px;font-weight:600}
  .gate .sub{color:var(--ink-soft);font-size:14px;letter-spacing:2px;margin:0 0 6px}
  .gate .sub-en{color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin:0 0 30px;font-family:var(--sans)}
  .gate input[type=password],.gate input[type=text]{
    width:100%;padding:13px 14px;font-size:16px;font-family:var(--sans);color:var(--ink);
    border:1px solid var(--line);border-radius:6px;background:#fff;text-align:center;letter-spacing:1px;margin-bottom:12px}
  .gate input:focus{outline:none;border-color:var(--vermilion)}
  .gate .hint{font-size:12.5px;color:var(--muted);line-height:1.8;font-family:var(--sans);margin-top:16px;text-align:left}
  .gate label.flabel{display:block;text-align:left;font-size:12.5px;color:var(--ink-soft);font-family:var(--sans);margin:10px 0 5px}
  .err{color:var(--vermilion);font-size:13.5px;min-height:20px;font-family:var(--sans);margin:4px 0 8px}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  .gate-card{position:relative}
  .lang-switch{position:absolute;top:12px;right:12px;display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;font-family:var(--sans)}
  .lang-switch button{appearance:none;border:none;background:transparent;padding:4px 11px;font-size:12px;color:var(--muted);cursor:pointer;letter-spacing:1px}
  .lang-switch button.on{background:var(--vermilion);color:#fdf6ec}

  .phrase-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 6px;text-align:left}
  .phrase-word{background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:16px;letter-spacing:1px}
  .phrase-word span{color:var(--muted);font-size:11.5px;margin-right:8px;font-family:var(--sans)}
  .checkline{display:flex;gap:9px;align-items:flex-start;text-align:left;font-size:13.5px;font-family:var(--sans);color:var(--ink-soft);margin:14px 0 6px;line-height:1.7;cursor:pointer}
  .checkline input{margin-top:4px;flex:none}
  .phrase-input{width:100%;padding:13px 14px;font-size:16px;font-family:var(--sans);color:var(--ink);border:1px solid var(--line);border-radius:6px;background:#fff;letter-spacing:1px;margin-bottom:12px;resize:vertical}
  .phrase-input:focus{outline:none;border-color:var(--vermilion)}
  /* ---------- buttons ---------- */
  .btn{appearance:none;border:1px solid var(--vermilion);background:var(--vermilion);color:#fdf6ec;
    font-family:var(--serif);font-size:15px;letter-spacing:3px;padding:12px 26px;border-radius:6px;cursor:pointer;width:100%}
  .btn:active{background:var(--vermilion-soft)}
  .btn[disabled]{opacity:.55;cursor:wait}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);width:auto;padding:8px 16px;font-size:13.5px;letter-spacing:2px}
  .btn-ghost:active{background:#f1ead9}
  /* ---------- journal ---------- */
  header.top{display:flex;align-items:flex-end;justify-content:space-between;padding:34px 0 6px;border-bottom:2px solid var(--ink);margin-bottom:4px}
  header.top .t h1{font-size:26px;letter-spacing:5px;margin:0;font-weight:600}
  header.top .t p{margin:5px 0 2px;color:var(--muted);font-size:12px;letter-spacing:2.5px;font-family:var(--sans)}
  .top-actions{display:flex;gap:8px;padding-bottom:4px}
  .mode-badge{display:inline-block;font-family:var(--sans);font-size:11px;color:var(--gold);border:1px solid #d9c48c;
    border-radius:20px;padding:2px 10px;letter-spacing:1px;margin:10px 0 0;background:#fbf6e6}
  .write-bar{margin:22px 0 6px;display:flex;justify-content:center}
  .btn-write{width:auto;padding:12px 34px;font-size:15.5px}
  .day-group{margin-top:30px}
  .day-head{display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-size:14.5px;letter-spacing:2px}
  .day-head::after{content:"";flex:1;border-top:1px solid var(--line)}
  .day-head .wk{color:var(--muted);font-size:12.5px}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 22px 16px;margin-top:14px;
    box-shadow:0 3px 14px rgba(90,75,50,.06)}

  .seal{flex:none;width:38px;height:38px;border-radius:7px;color:#fdf6ec;font-size:18px;line-height:38px;text-align:center;

  .entry-head .when{color:var(--muted);font-size:12px;font-family:var(--sans);margin-top:1px}
  .entry-head .ops{margin-left:auto;display:flex;gap:6px}
  .op-btn{border:none;background:none;color:var(--muted);font-family:var(--sans);font-size:12.5px;cursor:pointer;padding:4px 6px}
  .op-btn:active{color:var(--vermilion)}
  .entry-text{font-size:16.5px;line-height:2.05;letter-spacing:.4px;white-space:pre-wrap;word-break:break-word}
  .entry-imgs{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .entry-imgs img{width:100%;height:100%;max-height:300px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:zoom-in}
  .empty{text-align:center;color:var(--muted);padding:70px 20px;font-size:15px;letter-spacing:2px;line-height:2.2}
  .empty .big{font-size:19px;color:var(--ink-soft);letter-spacing:4px}
  /* ---------- composer ---------- */
  .composer{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-top:16px;
    box-shadow:0 8px 26px rgba(90,75,50,.10)}
  .composer h3{margin:0 0 14px;font-size:16px;letter-spacing:3px;font-weight:600}
  .author-pick{display:flex;gap:10px;margin-bottom:14px}
  .author-opt{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:6px;padding:7px 14px 7px 8px;cursor:pointer;font-size:14.5px;background:#fff}
  .author-opt.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .author-opt .seal{width:30px;height:30px;font-size:14.5px;line-height:30px;border-radius:5px}
  .composer textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:6px;padding:13px 14px;
    font-family:var(--serif);font-size:16px;line-height:1.9;color:var(--ink);background:#fff;resize:vertical}
  .composer textarea:focus{outline:none;border-color:var(--vermilion)}
  .img-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .img-thumb{position:relative;width:76px;height:76px}
  .img-thumb img{width:100%;height:100%;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
  .img-thumb button{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:none;
    background:var(--ink);color:#fff;font-size:12px;line-height:1;cursor:pointer}
  .composer-foot{display:flex;align-items:center;gap:10px;margin-top:16px}
  .attach-btn{font-family:var(--sans);font-size:13px;color:var(--ink-soft);border:1px dashed #cfc4a8;background:#fbf7ec;
    border-radius:6px;padding:9px 15px;cursor:pointer}
  .composer-foot .spacer{flex:1}
  .composer-foot .btn{width:auto;padding:10px 28px}
  .status-line{font-family:var(--sans);font-size:12.5px;color:var(--muted);min-height:18px;margin-top:10px}
  /* ---------- lightbox ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(20,17,12,.92);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox img{max-width:94vw;max-height:92vh;border-radius:4px}
  .hidden{display:none !important}
  /* ---------- print (成册) ---------- */
  #printArea{display:none}
  @media print{
    body{background:#fff}
    .screen{display:none !important}
    #printArea{display:block;font-family:var(--serif);color:#222;max-width:640px;margin:0 auto}
    #printArea .book-title{text-align:center;padding:120px 0 60px;page-break-after:always}
    #printArea .book-title h1{font-size:34px;letter-spacing:10px;font-weight:600}
    #printArea .book-title p{color:#666;letter-spacing:3px;font-size:13px}
    #printArea .p-entry{margin:0 0 34px;page-break-inside:avoid}
    #printArea .p-date{color:#888;font-size:12.5px;letter-spacing:2px;border-bottom:1px solid #ddd;padding-bottom:6px;margin-bottom:12px}
    #printArea .p-who{font-size:13.5px;color:#555;margin-bottom:6px;letter-spacing:1px}
    #printArea .p-text{font-size:14.5px;line-height:2.1;white-space:pre-wrap}
    #printArea img{max-width:100%;border-radius:2px;margin-top:10px;page-break-inside:avoid}
  }
</style>
</head>

/* =====================================================================
   两人笺 · A Journal for Two
   A private journal for exactly two people.
   - Single-file web app. No server, no account, no tracking, no notifications.
   - Entries are encrypted in the browser (AES-GCM, key derived from a shared
     password via PBKDF2) BEFORE they are stored.
   - Storage: a GitHub repository (via the GitHub API) when configured below,
     otherwise this browser's localStorage (demo / single-device mode).
   - The password is never stored anywhere. If it is lost, the journal
     cannot be opened again. Choose a long one and keep it somewhere safe.
   ===================================================================== */

let LANG = "zh";
try { LANG = localStorage.getItem(LS_PREFIX + "lang") || "zh"; } catch (e) {}
if (!I18N[LANG]) LANG = "zh";
function t(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.zh[k] || k; }
function setLang(l){
  if (!I18N[l]) return;
  LANG = l;
  try { localStorage.setItem(LS_PREFIX + "lang", l); } catch (e) {}
  document.documentElement.lang = (l === "en") ? "en" : "zh-CN";

/* ---------------- base64 / utf8 helpers ---------------- */
function u8ToB64(u8){
  let s = "";
  const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function b64ToU8(b64){
  const s = atob(String(b64).replace(/\s/g, ""));
  const u8 = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
  return u8;
}
const te = new TextEncoder(), td = new TextDecoder();
function strToB64(str){ return u8ToB64(te.encode(str)); }
function b64ToStr(b64){ return td.decode(b64ToU8(b64)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------- crypto ---------------- */
async function deriveKey(password, saltU8){
  const base = await crypto.subtle.importKey("raw", te.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: saltU8, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj)));
  return JSON.stringify({ v: 1, iv: u8ToB64(iv), ct: u8ToB64(new Uint8Array(ct)) });
}
async function decryptJSON(key, blob){
  const o = JSON.parse(blob);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToU8(o.iv) }, key, b64ToU8(o.ct));
  return JSON.parse(td.decode(pt));
}


/* ---------------- v2: master key + recovery phrase ----------------
   The journal's content is encrypted with a random master key.
   The master key is wrapped ("locked") twice, in two independent slots:
   once by a key derived from the shared password, once by a key derived
   from the recovery phrase. Either one opens the journal; the password
   can be reset with the phrase without touching any entry.          */
const RECOVERY_WORDS = ["apple","river","mountain","cloud","paper","stone","ocean","forest","window","garden","silver","golden","winter","summer","autumn","spring","morning","evening","candle","mirror","bridge","harbor","island","meadow","valley","desert","jungle","coral","pearl","amber","ivory","velvet","cotton","linen","marble","copper","bronze","iron","crystal","satin","breeze","thunder","lightning","rainbow","sunset","sunrise","moonlight","starlight","shadow","echo","whisper","melody","rhythm","poetry","letter","journal","pencil","ink","brush","canvas","violin","piano","guitar","flute","drum","bell","kite","balloon","feather","petal","leaf","branch","root","seed","bloom","rose","lily","lotus","bamboo","pine","maple","willow","orchid","tulip","daisy","violet","jasmine","peony","iris","fern","moss","clover","reef","wave","tide","shore","shell","sand","dune","cliff","cave","peak","lake","pond","stream","brook","falls","glacier","volcano","canyon","prairie","steppe","oasis","fjord","lagoon","atoll","bay","cape","dawn","dusk","twilight","midnight","aurora","comet","meteor","orbit","lunar","solar","cosmos","nebula","quasar","zenith","horizon","equator","meridian","atlas","compass","anchor","sail","voyage","marina","lighthouse","beacon","lantern","torch","ember","flame","spark","ash","smoke","mist","fog","frost","snow","rain","hail","storm","wind","gale","zephyr","monsoon","cyclone","tempest","serene","gentle","quiet","silent","sunny","crimson","azure","scarlet","jade","onyx","opal","ruby","topaz","garnet","quartz","agate","beryl","citrine","diamond","emerald","sapphire","amethyst","turquoise","lazuli","malachite","obsidian","basalt","granite","slate","shale","flint","chalk","clay","peat","gravel","pebble","boulder","cobble","timber","cedar","birch","oak","elm","juniper","beech","walnut","chestnut","hazel","acorn","almond","apricot","peach","plum","pear","fig","olive","lemon","melon","grape","berry","cherry","mango","kiwi","papaya","guava","lychee","persimmon","quince","rowan","sorrel","thyme","basil","mint","sage","rosemary","fennel","anise","clove","nutmeg","ginger","saffron","vanilla","cocoa","coffee","tea","honey","milk","cream","butter","cheese","bread","cake","pie"];
function genPhrase(){
  const b = crypto.getRandomValues(new Uint8Array(10));
  return Array.from(b, x => RECOVERY_WORDS[x]).join(" ");
}
function normPhrase(s){ return String(s || "").trim().toLowerCase().split(/\s+/).join(" "); }
async function makeMasterKey(){ return crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]); }
async function exportMaster(key){ return u8ToB64(new Uint8Array(await crypto.subtle.exportKey("raw", key))); }
async function importMaster(b64){ return crypto.subtle.importKey("raw", b64ToU8(b64), { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]); }
async function wrapSlot(secret, masterB64){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const kek = await deriveKey(secret, salt);
  const wrapped = await encryptJSON(kek, { master: masterB64 });
  return { salt: u8ToB64(salt), wrapped };
}
async function unwrapSlot(secret, slot){
  const kek = await deriveKey(secret, b64ToU8(slot.salt));
  const obj = await decryptJSON(kek, slot.wrapped);   // throws if secret is wrong
  return importMaster(obj.master);
}
function slotOf(vault, type){ return (vault.slots || []).find(s => s.type === type) || null; }

/* ---------------- state ---------------- */
const S = {
  mode: (JOURNAL_CONFIG.owner && JOURNAL_CONFIG.repo) ? "github" : "local",
  key: null, salt: null, names: [], token: null,
  entries: [],          // [{file, sha, data:{id, author, ts, text, images[]}}]
  composeImages: [],    // dataURLs pending in composer
  editingFile: null,
  screen: "", hint: "", isV2: false, pairNo: null, createdAt: "", _vault: null
};

/* ---------------- GitHub API ---------------- */
function ghHeaders(useToken){
  const h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  const t = useToken === false ? null : (S.token || (S._setupToken || null));
  if (t) h["Authorization"] = "Bearer " + t;
  return h;
}
function ghUrl(path){ return "https://api.github.com/repos/" + JOURNAL_CONFIG.owner + "/" + JOURNAL_CONFIG.repo + "/contents/" + path; }
async function ghGet(path, useToken){
  const r = await fetch(ghUrl(path) + "?ref=" + JOURNAL_CONFIG.branch, { headers: ghHeaders(useToken) });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(t("ghRead") + " (" + r.status + ")");
  const j = await r.json();
  return { content: b64ToStr(j.content), sha: j.sha };
}
async function ghPut(path, contentStr, message, sha, tokenOverride){
  const body = { message, content: strToB64(contentStr), branch: JOURNAL_CONFIG.branch };
  if (sha) body.sha = sha;
  const old = S.token; if (tokenOverride) S.token = tokenOverride;
  try {
    const r = await fetch(ghUrl(path), { method: "PUT", headers: { ...ghHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(t("ghSave") + " (" + r.status + ") " + (e.message || "")); }
    const j = await r.json();
    return j.content && j.content.sha;
  } finally { S.token = old; }
}
async function ghDelete(path, sha){
  const r = await fetch(ghUrl(path), { method: "DELETE", headers: { ...ghHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify({ message: "删除一篇日记", sha, branch: JOURNAL_CONFIG.branch }) });
  if (!r.ok) throw new Error(t("ghDel") + " (" + r.status + ")");
}
async function ghListEntries(){
  const r = await fetch(ghUrl("entries") + "?ref=" + JOURNAL_CONFIG.branch, { headers: ghHeaders() });
  if (r.status === 404) return [];
  if (!r.ok) throw new Error(t("ghList") + " (" + r.status + ")");
  const j = await r.json();
  return j.filter(x => x.type === "file" && /\.json$/.test(x.name)).map(x => x.name);
}

/* ---------------- storage drivers ---------------- */
const store = {
  async getVault(){
    if (S.mode === "github"){ const f = await ghGet("vault.json", false); return f ? JSON.parse(f.content) : null; }
    const v = localStorage.getItem(LS_PREFIX + "vault"); return v ? JSON.parse(v) : null;
  },
  async putVault(vaultObj, tokenOverride){
    if (S.mode === "github"){
      let sha = null;
      try { const old = S.token; if (tokenOverride) S.token = tokenOverride; const cur = await ghGet("vault.json"); sha = cur ? cur.sha : null; S.token = old; } catch (e) {}
      await ghPut("vault.json", JSON.stringify(vaultObj, null, 2), sha ? "更新日记本设置" : "初始化日记本", sha, tokenOverride);
    }
    else localStorage.setItem(LS_PREFIX + "vault", JSON.stringify(vaultObj));
  },
  async getConfig(){
    if (S.mode === "github"){ const f = await ghGet("config.enc", false); return f ? f.content : null; }
    return localStorage.getItem(LS_PREFIX + "config");
  },
  async putConfig(blob, tokenOverride){
    if (S.mode === "github") await ghPut("config.enc", blob, "保存日记本设置", null, tokenOverride);
    else localStorage.setItem(LS_PREFIX + "config", blob);
  },
  async listEntryFiles(){
    if (S.mode === "github") return ghListEntries();
    const all = JSON.parse(localStorage.getItem(LS_PREFIX + "entries") || "{}");
    return Object.keys(all);
  },
  async getEntry(file){
    if (S.mode === "github"){ const f = await ghGet("entries/" + file); return f ? { blob: f.content, sha: f.sha } : null; }
    const all = JSON.parse(localStorage.getItem(LS_PREFIX + "entries") || "{}");
    return all[file] ? { blob: all[file], sha: null } : null;
  },
  async putEntry(file, blob, sha){
    if (S.mode === "github") return ghPut("entries/" + file, blob, sha ? "修改一篇日记" : "新添一篇日记", sha);
    const all = JSON.parse(localStorage.getItem(LS_PREFIX + "entries") || "{}");
    all[file] = blob; localStorage.setItem(LS_PREFIX + "entries", JSON.stringify(all));
    return null;
  },
  async deleteEntry(file, sha){
    if (S.mode === "github") return ghDelete("entries/" + file, sha);
    const all = JSON.parse(localStorage.getItem(LS_PREFIX + "entries") || "{}");
    delete all[file]; localStorage.setItem(LS_PREFIX + "entries", JSON.stringify(all));
  }
};
</script>
<script>
"use strict";
/* ---------------- UI ---------------- */
const app = document.getElementById("app");
const WEEK = ["日","一","二","三","四","五","六"];
const WEEK_EN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDay(ts){ const d = new Date(ts); if (LANG === "en") return MONTHS_EN[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日"; }
function fmtWeek(ts){ const d = new Date(ts); return LANG === "en" ? WEEK_EN[d.getDay()] : "星期" + WEEK[d.getDay()]; }
function fmtTime(ts){ const d = new Date(ts); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function entryFileName(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,"0");
  const rand = Math.random().toString(36).slice(2,6);
  return "e" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + "-" + rand + ".json";
}
function sealHTML(idx, name, cls){ return '<div class="seal ' + (idx === 0 ? "a" : "b") + (cls ? " " + cls : "") + '">' + esc((name || "?").slice(0,1)) + "</div>"; }

function langSwitchHTML(){
  return '<div class="lang-switch"><button type="button" data-setlang="zh" class="' + (LANG === "zh" ? "on" : "") + '">中文</button>' +
    '<button type="button" data-setlang="en" class="' + (LANG === "en" ? "on" : "") + '">EN</button></div>';
}
function wireLangSwitch(){
  app.querySelectorAll("[data-setlang]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.setlang === LANG) return;
    setLang(b.dataset.setlang);
    if (S.screen === "setup") setupScreen(); else if (S.screen === "journal") renderJournal(); else lockScreen();
  }));
}
function cycleLang(){ setLang(LANG === "zh" ? "en" : "zh"); renderJournal(); }

function gateShell(inner){
  app.innerHTML = '<div class="gate"><div class="gate-card" id="gateCard">' + langSwitchHTML() +
    '<div class="gate-seal">笺</div><h1>两人笺</h1>' +
    '<p class="sub">' + t("sub") + '</p><p class="sub-en">' + t("subAlt") + "</p>" + inner + "</div></div>";
  wireLangSwitch();
}
function lockScreen(errMsg){
  S.screen = "lock";
  const hintLink = S.hint ? '<p class="hint" style="text-align:center"><a href="#" id="hintLink" style="color:var(--vermilion)">' + t("forgotLink") + '</a></p><p class="hint hidden" id="hintText" style="text-align:center">' + t("hintWas") + esc(S.hint) + "</p>" : "";
  const recLink = S.isV2 ? '<p class="hint" style="text-align:center"><a href="#" id="recLink" style="color:var(--vermilion)">' + t("recLink") + "</a></p>" : "";
  const pair = pairLabel();
  gateShell(
    '<form id="unlockForm"><input type="password" id="pw" placeholder="' + t("unlockPwPh") + '" autocomplete="current-password">' +
    '<div class="err" id="gateErr">' + esc(errMsg || "") + '</div>' +
    '<button class="btn" type="submit" id="unlockBtn">' + t("unlockBtn") + "</button></form>" + hintLink + recLink +
    '<p class="hint">' + t("unlockHint") + "</p>" +
    (S.mode === "local" ? '<p class="hint">' + t("localHint") + "</p>" : "") +
    (pair ? '<p class="hint" style="text-align:center;letter-spacing:2px;margin-top:22px">' + esc(pair) + "</p>" : "")
  );
  document.getElementById("unlockForm").addEventListener("submit", doUnlock);
  const hl = document.getElementById("hintLink");
  if (hl) hl.addEventListener("click", e => { e.preventDefault(); document.getElementById("hintText").classList.remove("hidden"); hl.classList.add("hidden"); });
  const rl = document.getElementById("recLink");
  if (rl) rl.addEventListener("click", e => { e.preventDefault(); recoveryScreen(); });
  document.getElementById("pw").focus();
}
function setupScreen(errMsg){
  S.screen = "setup";
  const gh = S.mode === "github";
  gateShell(
    '<form id="setupForm">' +
    '<label class="flabel">' + t("namesLabel") + "</label>" +
    '<div style="display:flex;gap:8px"><input type="text" id="nameA" placeholder="' + t("nameA") + '" maxlength="12"><input type="text" id="nameB" placeholder="' + t("nameB") + '" maxlength="12"></div>' +
    '<label class="flabel">' + t("pwLabel") + "</label>" +
    '<input type="password" id="pw1" placeholder="' + t("pw1Ph") + '" autocomplete="new-password">' +
    '<input type="password" id="pw2" placeholder="' + t("pw2Ph") + '" autocomplete="new-password">' +
    '<label class="flabel">' + t("hintLabel") + "</label>" +
    '<input type="text" id="pwhint" placeholder="' + t("hintPh") + '" maxlength="60">' +
    (gh ? '<label class="flabel">' + t("tokenLabel") + '</label><input type="text" id="ghtoken" placeholder="github_pat_…">' : "") +
    '<div class="err" id="gateErr">' + esc(errMsg || "") + "</div>" +
    '<button class="btn" type="submit" id="setupBtn">' + t("setupBtn") + "</button></form>" +
    '<p class="hint">' + t("setupHint") + "</p>"
  );
  document.getElementById("setupForm").addEventListener("submit", doSetup);
}

async function doUnlock(e){
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const btn = document.getElementById("unlockBtn"), err = document.getElementById("gateErr");
  if (!pw) return;
  btn.disabled = true; btn.textContent = t("unlockBusy"); err.textContent = "";
  try {
    const vault = await store.getVault();
    if (!vault) { setupScreen(); return; }
    S.hint = vault.hint || ""; S.isV2 = vault.v === 2; S.createdAt = vault.createdAt || ""; S.pairNo = vault.pairNo || null;
    let key;
    if (S.isV2) key = await unwrapSlot(pw, slotOf(vault, "password"));
    else key = await deriveKey(pw, b64ToU8(vault.salt));
    const blob = await store.getConfig();
    const cfg = await decryptJSON(key, blob);   // throws if password is wrong
    S.key = key; S.salt = vault.salt; S.names = cfg.names || t("defaultNames"); S.token = cfg.token || null;
    await enterJournal();
  } catch (ex) {
    btn.disabled = false; btn.textContent = t("unlockBtn");
    err.textContent = t("unlockErr");
    document.getElementById("gateCard").classList.add("shake");
    setTimeout(() => document.getElementById("gateCard").classList.remove("shake"), 450);
  }
}
async function doSetup(e){
  e.preventDefault();
  const nameA = document.getElementById("nameA").value.trim(), nameB = document.getElementById("nameB").value.trim();
  const pw1 = document.getElementById("pw1").value, pw2 = document.getElementById("pw2").value;
  const hint = document.getElementById("pwhint").value.trim();
  const err = document.getElementById("gateErr"), btn = document.getElementById("setupBtn");
  const tokenEl = document.getElementById("ghtoken");
  const token = tokenEl ? tokenEl.value.trim() : null;
  if (!nameA || !nameB) { err.textContent = t("errNames"); return; }
  if (pw1.length < 8) { err.textContent = t("errPwShort"); return; }
  if (pw1 !== pw2) { err.textContent = t("errPwMismatch"); return; }
  if (S.mode === "github" && !token) { err.textContent = t("errToken"); return; }
  btn.disabled = true; btn.textContent = t("setupBusy");
  try {
    const master = await makeMasterKey();
    const masterB64 = await exportMaster(master);
    const slotPw = await wrapSlot(pw1, masterB64);
    const phrase = genPhrase();
    const slotRec = await wrapSlot(normPhrase(phrase), masterB64);
    const vaultObj = { v: 2, createdAt: new Date().toISOString().slice(0, 10),
      slots: [ { type: "password", salt: slotPw.salt, wrapped: slotPw.wrapped },
               { type: "recovery", salt: slotRec.salt, wrapped: slotRec.wrapped } ] };
    if (hint) vaultObj.hint = hint;
    const configBlob = await encryptJSON(master, { names: [nameA, nameB], token });
    phraseScreen({ vaultObj, configBlob, master, names: [nameA, nameB], token, phrase });
  } catch (ex) {
    btn.disabled = false; btn.textContent = t("setupBtn");
    err.textContent = t("errSetup") + (ex.message || "");
  }
}

async function enterJournal(){
  S.screen = "loading";
  gateShell('<p class="sub" style="margin-top:10px">' + t("loading") + "</p>");
  const files = await store.listEntryFiles();
  const out = [];
  for (const f of files) {
    const rec = await store.getEntry(f);
    if (!rec) continue;
    try { out.push({ file: f, sha: rec.sha, data: await decryptJSON(S.key, rec.blob) }); } catch (e) { /* skip undecryptable */ }
  }
  out.sort((x, y) => new Date(y.data.ts) - new Date(x.data.ts));
  S.entries = out;
  renderJournal();
}

function renderJournal(){
  S.screen = "journal";
  const groups = {};
  for (const en of S.entries) { const d = fmtDay(en.data.ts); (groups[d] = groups[d] || []).push(en); }
  const days = Object.keys(groups).sort((a, b) => new Date(groups[b][0].data.ts) - new Date(groups[a][0].data.ts));
  const headLine = LANG === "en" ? ("The journal of " + esc(S.names.join(" & "))) : (esc(S.names.join(" · ")) + t("journalOf"));
  let h = '<div class="screen"><div class="wrap">' +
    '<header class="top"><div class="t"><h1>两人笺</h1><p>' + headLine + "</p></div>" +
    '<div class="top-actions"><button class="btn-ghost btn" onclick="cycleLang()">' + (LANG === "zh" ? "EN" : "中文") + "</button>" +
    (S.mode === "github" ? '<button class="btn-ghost btn" onclick="updateToken()">' + t("settingsBtn") + "</button>" : "") +
    '<button class="btn-ghost btn" onclick="printBook()">' + t("printBtn") + "</button>" +
    '<button class="btn-ghost btn" onclick="location.reload()">' + t("lockBtn") + "</button></div></header>" +
    (S.mode === "local" ? '<span class="mode-badge">' + t("localBadge") + "</span>" : "") + (pairLabel() ? '<span class="mode-badge">' + esc(pairLabel()) + "</span>" : "") +
    '<div class="write-bar"><button class="btn btn-write" onclick="openComposer()">' + t("writeBtn") + "</button></div>" +
    '<div id="composerSlot"></div>';
  if (!S.entries.length) {
    h += '<div class="empty"><div class="big">' + t("emptyBig") + "</div>" + t("emptyText") + "</div>";
  }
  for (const d of days) {
    h += '<div class="day-group"><div class="day-head"><span>' + d + '</span><span class="wk">' + fmtWeek(groups[d][0].data.ts) + "</span></div>";
    for (const en of groups[d]) h += entryHTML(en);
    h += "</div>";
  }
  h += "</div></div>";
  app.innerHTML = h;
}
function entryHTML(en){
  const d = en.data;
  const imgs = (d.images || []).map(src => '<img src="' + src + '" onclick="zoomImg(this.src)" alt="">').join("");
  return '<article class="entry"><div class="entry-head">' + sealHTML(d.author, S.names[d.author]) +
    '<div><div class="who">' + esc(S.names[d.author] || "") + '</div><div class="when">' + fmtTime(d.ts) + "</div></div>" +
    '<div class="ops"><button class="op-btn" onclick="editEntry(\'' + en.file + '\')">' + t("opEdit") + "</button>" +
    '<button class="op-btn" onclick="delEntry(\'' + en.file + '\')">' + t("opDel") + "</button></div></div>" +
    '<div class="entry-text">' + esc(d.text || "") + "</div>" +
    (imgs ? '<div class="entry-imgs">' + imgs + "</div>" : "") + "</article>";
}


/* ---------------- v2 screens: phrase, recovery, reset ---------------- */
function pairLabel(){
  if (S.pairNo) return LANG === "en" ? ("Pair No. " + S.pairNo + " to leave their fragments here") : ("第 " + S.pairNo + " 对 · 把碎片留下来的人");
  if (S.createdAt) return (LANG === "en" ? "This journal · since " : "这一本 · 始于 ") + S.createdAt;
  return "";
}
function phraseScreen(p){
  S.screen = "phrase";
  const words = p.phrase.split(" ");
  gateShell(
    '<p class="sub" style="letter-spacing:1px">' + t("phraseTitle") + "</p>" +
    '<div class="phrase-grid">' + words.map((w, i) => '<div class="phrase-word"><span>' + (i + 1) + "</span>" + esc(w) + "</div>").join("") + "</div>" +
    '<p class="hint">' + t("phraseWarn") + "</p>" +
    '<label class="checkline"><input type="checkbox" id="phraseAck"> ' + t("phraseCheck") + "</label>" +
    '<div class="err" id="gateErr"></div>' +
    '<button class="btn" id="phraseBtn" disabled>' + t("phraseBtn") + "</button>"
  );
  const ack = document.getElementById("phraseAck"), btn = document.getElementById("phraseBtn");
  ack.addEventListener("change", () => { btn.disabled = !ack.checked; });
  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = t("setupBusy");
    try {
      await store.putVault(p.vaultObj, p.token);
      await store.putConfig(p.configBlob, p.token);
      S.key = p.master; S.names = p.names; S.token = p.token; S.hint = p.vaultObj.hint || "";
      S.isV2 = true; S.createdAt = p.vaultObj.createdAt || ""; S.pairNo = p.vaultObj.pairNo || null;
      await enterJournal();
    } catch (ex) {
      btn.disabled = false; btn.textContent = t("phraseBtn");
      document.getElementById("gateErr").textContent = t("errSetup") + (ex.message || "");
    }
  });
}
function recoveryScreen(errMsg){
  S.screen = "recovery";
  gateShell(
    '<p class="sub" style="letter-spacing:1px">' + t("recTitle") + "</p>" +
    '<form id="recForm"><textarea id="recPhrase" class="phrase-input" rows="3" placeholder="' + t("recPh") + '"></textarea>' +
    '<div class="err" id="gateErr">' + esc(errMsg || "") + "</div>" +
    '<button class="btn" type="submit" id="recBtn">' + t("recBtn") + "</button></form>" +
    '<p class="hint">' + t("recDesc") + "</p>"
  );
  document.getElementById("recForm").addEventListener("submit", doRecovery);
  document.getElementById("recPhrase").focus();
}
async function doRecovery(e){
  e.preventDefault();
  const phrase = normPhrase(document.getElementById("recPhrase").value);
  const btn = document.getElementById("recBtn"), err = document.getElementById("gateErr");
  if (!phrase) return;
  btn.disabled = true; err.textContent = "";
  try {
    const vault = await store.getVault();
    const slot = slotOf(vault, "recovery");
    if (!slot) throw new Error("no recovery slot");
    const master = await unwrapSlot(phrase, slot);
    const blob = await store.getConfig();
    const cfg = await decryptJSON(master, blob);
    S.key = master; S.names = cfg.names || t("defaultNames"); S.token = cfg.token || null;
    S._vault = vault;
    resetPwScreen();
  } catch (ex) {
    btn.disabled = false;
    err.textContent = t("recErr");
  }
}
function resetPwScreen(errMsg){
  S.screen = "resetpw";
  gateShell(
    '<p class="sub" style="letter-spacing:1px">' + t("resetTitle") + "</p>" +
    '<form id="resetForm">' +
    '<input type="password" id="npw1" placeholder="' + t("pw1Ph") + '" autocomplete="new-password">' +
    '<input type="password" id="npw2" placeholder="' + t("pw2Ph") + '" autocomplete="new-password">' +
    '<div class="err" id="gateErr">' + esc(errMsg || "") + "</div>" +
    '<button class="btn" type="submit" id="resetBtn">' + t("resetBtn") + "</button></form>" +
    '<p class="hint">' + t("resetDesc") + "</p>"
  );
  document.getElementById("resetForm").addEventListener("submit", doResetPw);
}
async function doResetPw(e){
  e.preventDefault();
  const pw1 = document.getElementById("npw1").value, pw2 = document.getElementById("npw2").value;
  const err = document.getElementById("gateErr"), btn = document.getElementById("resetBtn");
  if (pw1.length < 8) { err.textContent = t("errPwShort"); return; }
  if (pw1 !== pw2) { err.textContent = t("errPwMismatch"); return; }
  btn.disabled = true;
  try {
    const masterB64 = await exportMaster(S.key);
    const slot = await wrapSlot(pw1, masterB64);
    const vault = S._vault || await store.getVault();
    const ix = (vault.slots || []).findIndex(s => s.type === "password");
    const newSlot = { type: "password", salt: slot.salt, wrapped: slot.wrapped };
    if (ix >= 0) vault.slots[ix] = newSlot; else vault.slots.push(newSlot);
    await store.putVault(vault);
    S._vault = null;
    await enterJournal();
  } catch (ex) {
    btn.disabled = false;
    err.textContent = t("errSetup") + (ex.message || "");
  }
}

/* ---------------- composer ---------------- */
function openComposer(prefill){
  S.composeImages = prefill ? (prefill.data.images || []).slice() : [];
  S.editingFile = prefill ? prefill.file : null;
  S.composeAuthor = prefill ? prefill.data.author : (parseInt(localStorage.getItem(LS_PREFIX + "lastauthor") || "0", 10) || 0);
  const slot = document.getElementById("composerSlot");
  slot.innerHTML = '<div class="composer"><h3>' + (prefill ? t("editTitle") : t("newTitle")) + "</h3>" +
    '<div class="author-pick">' + S.names.map((n, i) =>
      '<div class="author-opt' + (i === S.composeAuthor ? " sel" : "") + '" data-author="' + i + '">' + sealHTML(i, n) + esc(n) + "</div>").join("") + "</div>" +
    '<textarea id="composeText" placeholder="' + t("composePh") + '">' + (prefill ? esc(prefill.data.text || "") : "") + "</textarea>" +
    '<div class="img-row" id="imgRow"></div>' +
    '<div class="composer-foot"><label class="attach-btn">' + t("addImg") + '<input type="file" id="imgInput" accept="image/*" multiple class="hidden"></label>' +
    '<div class="spacer"></div><button class="btn-ghost btn" onclick="closeComposer()">' + t("cancelBtn") + "</button>" +
    '<button class="btn" id="saveBtn" onclick="saveEntry()">' + t("saveBtn") + "</button></div>" +
    '<div class="status-line" id="composeStatus"></div></div>';
  slot.querySelectorAll(".author-opt").forEach(el => el.addEventListener("click", () => {
    S.composeAuthor = parseInt(el.dataset.author, 10);
    slot.querySelectorAll(".author-opt").forEach(x => x.classList.toggle("sel", x === el));
  }));
  document.getElementById("imgInput").addEventListener("change", onImagesPicked);
  renderComposeImages();
  slot.scrollIntoView({ behavior: "smooth", block: "start" });
  document.getElementById("composeText").focus();
}
function closeComposer(){ document.getElementById("composerSlot").innerHTML = ""; S.editingFile = null; S.composeImages = []; }
function renderComposeImages(){
  const row = document.getElementById("imgRow"); if (!row) return;
  row.innerHTML = S.composeImages.map((src, i) =>
    '<div class="img-thumb"><img src="' + src + '"><button onclick="removeComposeImage(' + i + ')">×</button></div>').join("");
}
function removeComposeImage(i){ S.composeImages.splice(i, 1); renderComposeImages(); }
async function onImagesPicked(e){
  const status = document.getElementById("composeStatus");
  for (const file of e.target.files) {
    try { S.composeImages.push(await compressImage(file)); }
    catch (err) { status.textContent = t("imgSkip"); }
  }
  e.target.value = "";
  renderComposeImages();
}
function compressImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX = 1400;
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, MAX / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = reject;
    img.src = url;
  });
}
async function saveEntry(){
  const text = document.getElementById("composeText").value.trim();
  const status = document.getElementById("composeStatus"), btn = document.getElementById("saveBtn");
  if (!text && !S.composeImages.length) { status.textContent = t("errEmpty"); return; }
  btn.disabled = true; status.textContent = t("saving");
  try {
    let file = S.editingFile, sha = null, ts = new Date().toISOString(), oldId = null;
    if (file) { const old = S.entries.find(x => x.file === file); if (old) { sha = old.sha; ts = old.data.ts; oldId = old.data.id; } }
    else file = entryFileName(ts);
    const data = { id: oldId || Math.random().toString(36).slice(2, 10), author: S.composeAuthor, ts, text, images: S.composeImages.slice() };
    const blob = await encryptJSON(S.key, data);
    const newSha = await store.putEntry(file, blob, sha);
    localStorage.setItem(LS_PREFIX + "lastauthor", String(S.composeAuthor));
    const ix = S.entries.findIndex(x => x.file === file);
    const rec = { file, sha: newSha || sha, data };
    if (ix >= 0) S.entries[ix] = rec; else S.entries.push(rec);
    S.entries.sort((a, b) => new Date(b.data.ts) - new Date(a.data.ts));
    renderJournal();
  } catch (ex) {
    btn.disabled = false;
    status.textContent = t("saveFail") + (ex.message || "");
  }
}
function editEntry(file){ const en = S.entries.find(x => x.file === file); if (en) openComposer(en); }
async function delEntry(file){
  if (!confirm(t("confirmDel"))) return;
  const en = S.entries.find(x => x.file === file);
  try { await store.deleteEntry(file, en ? en.sha : null); S.entries = S.entries.filter(x => x.file !== file); renderJournal(); }
  catch (ex) { alert(t("delFail") + (ex.message || "")); }
}

/* ---------------- settings: renew the GitHub token before it expires ---------------- */
async function updateToken(){
  const tk = prompt(t("tokenPrompt"));
  if (!tk || !tk.trim()) return;
  try {
    const cur = await ghGet("config.enc", false);
    const blob = await encryptJSON(S.key, { names: S.names, token: tk.trim() });
    await ghPut("config.enc", blob, "更新访问令牌", cur ? cur.sha : null);
    S.token = tk.trim();
    alert(t("tokenOk"));
  } catch (ex) { alert(t("tokenFail") + (ex.message || "")); }
}

/* ---------------- print / book ---------------- */
function printBook(){
  const asc = S.entries.slice().sort((a, b) => new Date(a.data.ts) - new Date(b.data.ts));
  let h = '<div class="book-title"><h1>两人笺</h1><p>' + esc(S.names.join(t("namesJoin"))) + "</p><p>" +
    (asc.length ? fmtDay(asc[0].data.ts) + " — " + fmtDay(asc[asc.length-1].data.ts) + " · " + asc.length + t("entriesSuffix") : "") + "</p></div>";
  for (const en of asc) {
    const d = en.data;
    h += '<div class="p-entry"><div class="p-date">' + fmtDay(d.ts) + " " + fmtWeek(d.ts) + " " + fmtTime(d.ts) + '</div>' +
      '<div class="p-who">' + esc(S.names[d.author] || "") + '</div><div class="p-text">' + esc(d.text || "") + "</div>" +
      (d.images || []).map(src => '<img src="' + src + '">').join("") + "</div>";
  }
  document.getElementById("printArea").innerHTML = h;
  window.print();
}

/* ---------------- lightbox ---------------- */
function zoomImg(src){ const lb = document.getElementById("lightbox"); document.getElementById("lightboxImg").src = src; lb.classList.add("open"); }
document.getElementById("lightbox").addEventListener("click", () => document.getElementById("lightbox").classList.remove("open"));

/* ---------------- boot ---------------- */
(async function boot(){
  document.documentElement.lang = (LANG === "en") ? "en" : "zh-CN";
  S.screen = "loading";
  gateShell('<p class="sub" style="margin-top:8px">' + t("loading") + "</p>");
  try {
    const vault = await store.getVault();
    if (vault) { S.hint = vault.hint || ""; S.isV2 = vault.v === 2; S.createdAt = vault.createdAt || ""; S.pairNo = vault.pairNo || null; }
    if (!vault) setupScreen(); else lockScreen();
  } catch (ex) { lockScreen(); }
})();
</script>
